<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA Player Cards</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel pour JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
    }
    .player-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .player-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ============================================================
       players.js — Données des joueurs
       ============================================================ */
    const players = [
      {
        id: 1,
        name: "Kylian Mbappé",
        team: "Real Madrid",
        nationality: "France",
        jerseyNumber: 9,
        age: 26,
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/b/b3/Kevin_De_Bruyne_201807091.jpg",
      },
      {
        id: 2,
        name: "Lionel Messi",
        team: "Inter Miami",
        nationality: "Argentine",
        jerseyNumber: 10,
        age: 37,
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/c/c1/Lionel_Messi_20180626.jpg",
      },
      {
        id: 3,
        name: "Cristiano Ronaldo",
        team: "Al-Nassr",
        nationality: "Portugal",
        jerseyNumber: 7,
        age: 40,
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg",
      },
      {
        id: 4,
        name: "Kevin De Bruyne",
        team: "Manchester City",
        nationality: "Belgique",
        jerseyNumber: 17,
        age: 33,
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/b/b3/Kevin_De_Bruyne_201807091.jpg",
      },
      {
        id: 5,
        name: "Erling Haaland",
        team: "Manchester City",
        nationality: "Norvège",
        jerseyNumber: 9,
        age: 24,
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/0/07/Erling_Haaland_2023_%28cropped%29.jpg",
      },
      {
        id: 6,
        name: "Vinícius Júnior",
        team: "Real Madrid",
        nationality: "Brésil",
        jerseyNumber: 7,
        age: 24,
        imageUrl: "https://upload.wikimedia.org/wikipedia/commons/1/1b/Vinicius_Jr_2021.jpg",
      },
    ];

    /* ============================================================
       Player.jsx — Composant Player avec props par défaut
       ============================================================ */
    function Player({
      name = "Nom Inconnu",
      team = "Équipe Inconnue",
      nationality = "Nationalité Inconnue",
      jerseyNumber = 0,
      age = 0,
      imageUrl = "https://via.placeholder.com/300x300?text=Player",
    }) {
      // Styles en ligne demandés par l'énoncé
      const cardStyle = {
        backgroundColor: "#1e293b",
        borderRadius: "1rem",
        overflow: "hidden",
        display: "flex",
        flexDirection: "column",
        border: "2px solid #334155",
        position: "relative",
      };

      const imageContainerStyle = {
        position: "relative",
        background: "linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%)",
        paddingTop: "8px",
      };

      const jerseyBadgeStyle = {
        position: "absolute",
        top: "12px",
        right: "12px",
        backgroundColor: "#facc15",
        color: "#0f172a",
        fontWeight: "900",
        fontSize: "1.25rem",
        width: "48px",
        height: "48px",
        borderRadius: "50%",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        boxShadow: "0 4px 12px rgba(0,0,0,0.5)",
        border: "3px solid #fff",
      };

      const infoRowStyle = {
        display: "flex",
        justifyContent: "space-between",
        alignItems: "center",
        padding: "0.5rem 1rem",
        borderBottom: "1px solid #334155",
      };

      return (
        <div className="player-card" style={cardStyle}>
          {/* Image du joueur */}
          <div style={imageContainerStyle}>
            <div style={jerseyBadgeStyle}>{jerseyNumber}</div>
            <img
              src={imageUrl}
              alt={name}
              style={{
                width: "100%",
                height: "260px",
                objectFit: "cover",
                objectPosition: "top",
              }}
              onError={(e) => {
                e.target.src =
                  "https://via.placeholder.com/300x300?text=" +
                  encodeURIComponent(name);
              }}
            />
          </div>

          {/* Nom & équipe */}
          <div style={{ padding: "1rem", textAlign: "center" }}>
            <h2
              style={{
                color: "#fff",
                fontSize: "1.5rem",
                fontWeight: "bold",
                margin: 0,
              }}
            >
              {name}
            </h2>
            <p
              style={{
                color: "#facc15",
                fontSize: "0.95rem",
                fontWeight: "600",
                marginTop: "4px",
              }}
            >
              {team}
            </p>
          </div>

          {/* Infos détaillées */}
          <div style={{ padding: "0 1rem 1rem" }}>
            <div style={infoRowStyle}>
              <span style={{ color: "#94a3b8", fontSize: "0.85rem" }}>
                🌍 Nationalité
              </span>
              <span style={{ color: "#e2e8f0", fontWeight: "600" }}>
                {nationality}
              </span>
            </div>
            <div style={infoRowStyle}>
              <span style={{ color: "#94a3b8", fontSize: "0.85rem" }}>
                👕 Numéro
              </span>
              <span style={{ color: "#e2e8f0", fontWeight: "600" }}>
                {jerseyNumber}
              </span>
            </div>
            <div style={{ ...infoRowStyle, borderBottom: "none" }}>
              <span style={{ color: "#94a3b8", fontSize: "0.85rem" }}>
                🎂 Âge
              </span>
              <span style={{ color: "#e2e8f0", fontWeight: "600" }}>
                {age} ans
              </span>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       PlayersList.jsx — Composant PlayersList
       ============================================================ */
    function PlayersList() {
      return (
        <div className="min-h-screen py-10 px-4">
          <header className="text-center mb-10">
            <h1 className="text-4xl md:text-5xl font-extrabold text-white mb-2">
              ⚽ FIFA Player Cards
            </h1>
            <p className="text-slate-400 text-lg">
              Les plus grandes stars du football mondial
            </p>
          </header>

          <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            {players.map((player) => (
              <Player
                key={player.id}
                name={player.name}
                team={player.team}
                nationality={player.nationality}
                jerseyNumber={player.jerseyNumber}
                age={player.age}
                imageUrl={player.imageUrl}
              />
            ))}
          </div>

          <footer className="text-center mt-12 text-slate-500 text-sm">
            © 2026 FIFA Cards — Devoir React
          </footer>
        </div>
      );
    }

    /* ============================================================
       App.jsx — Composant racine
       ============================================================ */
    function App() {
      return <PlayersList />;
    }

    /* ============================================================
       Rendu dans le DOM
       ============================================================ */
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
